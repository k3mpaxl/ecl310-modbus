[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecl310-modbus"
version = "0.3.0"
description = "Read and write a Danfoss ECL Comfort 310 heating controller over Modbus"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "k3mpaxl" }]
keywords = ["modbus", "danfoss", "ecl310", "heating", "home-assistant"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["modbus-connection>=4.10.0,<5"]

[project.urls]
Homepage = "https://github.com/k3mpaxl/ecl310-modbus"
"Used by" = "https://github.com/k3mpaxl/ecl310-hacs"

[tool.hatch.build.targets.wheel]
packages = ["src/ecl310_modbus"]
